name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Auto-increment version in app.json
        id: bump_version
        run: |
          node -e "
            const fs = require('fs');
            const app = require('./app.json');
            const currentVersion = app.expo.version || '1.0.0';
            const parts = currentVersion.split('.').map(Number);
            if (parts.length === 3) {
              parts[2] += 1;
            } else {
              parts.push(1);
            }
            const nextVersion = parts.join('.');
            app.expo.version = nextVersion;
            fs.writeFileSync('./app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('Next version calculated:', nextVersion);
            
            // Output to environment for subsequent steps
            fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + nextVersion + '\n');
          "

      - name: Install dependencies
        run: pnpm install

      - name: Expo Prebuild (Generate iOS folder)
        run: npx expo prebuild --platform ios --clean

      - name: Disable Xcode Code Signing
        run: |
          python3 -c '
          import os, re
          proj_path = "ios/BootHub.xcodeproj/project.pbxproj"
          if os.path.exists(proj_path):
              with open(proj_path, "r") as f:
                  content = f.read()
              
              # 1. Global overrides
              content = re.sub(r"DEVELOPMENT_TEAM\s*=\s*[^;]+;", "DEVELOPMENT_TEAM = \"\";", content)
              content = re.sub(r"CODE_SIGN_IDENTITY\s*=\s*[^;]+;", "CODE_SIGN_IDENTITY = \"\";", content)
              content = re.sub(r"CODE_SIGNING_REQUIRED\s*=\s*[^;]+;", "CODE_SIGNING_REQUIRED = NO;", content)
              content = re.sub(r"CODE_SIGNING_ALLOWED\s*=\s*[^;]+;", "CODE_SIGNING_ALLOWED = NO;", content)
              content = re.sub(r"PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;", "PROVISIONING_PROFILE_SPECIFIER = \"\";", content)
              content = re.sub(r"PROVISIONING_PROFILE\s*=\s*[^;]+;", "PROVISIONING_PROFILE = \"\";", content)
              
              # 2. Block-level injection
              def replace_settings(match):
                  block = match.group(1)
                  indent_match = re.search(r"(\n\s*)$", block)
                  indent = indent_match.group(1) if indent_match else "\n\t\t\t\t"
                  
                  keys_to_inject = {
                      "CODE_SIGNING_ALLOWED": "NO",
                      "CODE_SIGNING_REQUIRED": "NO",
                      "CODE_SIGN_IDENTITY": "\"\"",
                      "DEVELOPMENT_TEAM": "\"\"",
                      "PROVISIONING_PROFILE_SPECIFIER": "\"\""
                  }
                  
                  cleaned_block = block
                  if indent_match:
                      cleaned_block = block[:-len(indent_match.group(1))]
                      
                  for key, val in keys_to_inject.items():
                      if key not in cleaned_block:
                          cleaned_block += f"\n\t\t\t\t{key} = {val};"
                          
                  return f"buildSettings = {{{cleaned_block}{indent}}};"
              
              content = re.sub(r"buildSettings\s*=\s*\{(.*?)\};", replace_settings, content, flags=re.DOTALL)
              
              with open(proj_path, "w") as f:
                  f.write(content)
              print("Xcode project code signing disabled successfully.")
          '


      - name: Disable CocoaPods Code Signing
        run: |
          python3 -c '
          import os
          if os.path.exists("ios/Podfile"):
              with open("ios/Podfile", "r") as f:
                  content = f.read()
              target = "post_install do |installer|"
              insertion = "\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n    end\n  end\n"
              if target in content and insertion not in content:
                  content = content.replace(target, target + insertion)
                  with open("ios/Podfile", "w") as f:
                      f.write(content)
                  print("Podfile updated successfully to disable code signing.")
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          
      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild -workspace BootHub.xcworkspace \
            -scheme BootHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee xcodebuild.log

      - name: Parse and Report Xcode Errors
        if: failure()
        run: |
          python3 scripts/parse-build-errors.py

      - name: Upload Xcode Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-release-log
          path: ios/xcodebuild.log
          retention-days: 7


      - name: Package into IPA
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir Payload
          mv BootHub.app Payload/
          zip -qr ../../../../../BootHub.ipa Payload

      - name: Generate SideStore source.json
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          cat > sidestore.json << EOF
          {
            "name": "BootHub",
            "identifier": "com.bootlegyouki.boothub.source",
            "apps": [
              {
                "name": "BootHub",
                "bundleIdentifier": "com.bootlegyouki.boothub",
                "developerName": "BootlegYouki",
                "version": "${VERSION}",
                "versionDate": "${DATE}",
                "downloadURL": "https://github.com/${REPO}/releases/download/v${VERSION}/BootHub.ipa",
                "localizedDescription": "Brutalist template using Native components.",
                "iconURL": "https://raw.githubusercontent.com/${REPO}/main/assets/icon.png",
                "tintColor": "00E5FF",
                "size": 0
              }
            ]
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BootHub v${{ env.VERSION }}
          body: |
            ## BootHub v${{ env.VERSION }}
            
            ### Sideload via SideStore / Sideloadly / AltStore
            Download `BootHub.ipa` below and sideload it.
            
            ### SideStore Source URL
            Add this source to SideStore for auto-updates:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/sidestore.json
            ```
          files: |
            BootHub.ipa
            sidestore.json
          draft: false
          prerelease: false

      - name: Commit updated app.json and sidestore.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.json sidestore.json
          git stash
          git fetch origin main
          git rebase origin/main
          git stash pop
          git add app.json sidestore.json
          git diff --staged --quiet || git commit -m "chore: release v${VERSION} and update SideStore source [skip ci]"
          git push origin main
