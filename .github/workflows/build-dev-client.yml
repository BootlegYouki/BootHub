name: Build Dev Client IPA

# Run manually whenever you add a new native module and need to rebuild the dev binary
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Dev Client
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Expo Prebuild (Generate iOS folder with dev client)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Fix HostAppScheme in ShareExtension Info.plist
        run: |
          python3 -c '
          import plistlib, os
          path = "ios/BootHubShareExtension/Info.plist"
          if os.path.exists(path):
              with open(path, "rb") as f:
                  pl = plistlib.load(f)
              host_app_scheme = pl.get("HostAppScheme")
              print(f"Loaded HostAppScheme: {host_app_scheme} (type: {type(host_app_scheme)})")
              if isinstance(host_app_scheme, list):
                  print(f"Fixing HostAppScheme from array to string: {host_app_scheme}")
                  pl["HostAppScheme"] = host_app_scheme[0]
                  with open(path, "wb") as f:
                      plistlib.dump(pl, f)
                  print("Successfully updated Info.plist")
              else:
                  print("HostAppScheme is not a list, no change needed.")
          else:
              print(f"Error: {path} not found!")
          '

      - name: Disable Xcode Code Signing
        run: |
          python3 -c '
          import os, re
          proj_path = "ios/BootHub.xcodeproj/project.pbxproj"
          if os.path.exists(proj_path):
              with open(proj_path, "r") as f:
                  content = f.read()
              
              # 1. Global overrides
              content = re.sub(r"DEVELOPMENT_TEAM\s*=\s*[^;]+;", "DEVELOPMENT_TEAM = \"\";", content)
              content = re.sub(r"CODE_SIGN_IDENTITY\s*=\s*[^;]+;", "CODE_SIGN_IDENTITY = \"\";", content)
              content = re.sub(r"CODE_SIGNING_REQUIRED\s*=\s*[^;]+;", "CODE_SIGNING_REQUIRED = NO;", content)
              content = re.sub(r"CODE_SIGNING_ALLOWED\s*=\s*[^;]+;", "CODE_SIGNING_ALLOWED = NO;", content)
              content = re.sub(r"PROVISIONING_PROFILE_SPECIFIER\s*=\s*[^;]+;", "PROVISIONING_PROFILE_SPECIFIER = \"\";", content)
              content = re.sub(r"PROVISIONING_PROFILE\s*=\s*[^;]+;", "PROVISIONING_PROFILE = \"\";", content)
              
              # 2. Block-level injection
              def replace_settings(match):
                  block = match.group(1)
                  indent_match = re.search(r"(\n\s*)$", block)
                  indent = indent_match.group(1) if indent_match else "\n\t\t\t\t"
                  
                  keys_to_inject = {
                      "CODE_SIGNING_ALLOWED": "NO",
                      "CODE_SIGNING_REQUIRED": "NO",
                      "CODE_SIGN_IDENTITY": "\"\"",
                      "DEVELOPMENT_TEAM": "\"\"",
                      "PROVISIONING_PROFILE_SPECIFIER": "\"\""
                  }
                  
                  cleaned_block = block
                  if indent_match:
                      cleaned_block = block[:-len(indent_match.group(1))]
                      
                  for key, val in keys_to_inject.items():
                      if key not in cleaned_block:
                          cleaned_block += f"\n\t\t\t\t{key} = {val};"
                          
                  return f"buildSettings = {{{cleaned_block}{indent}}};"
              
              content = re.sub(r"buildSettings\s*=\s*\{(.*?)\};", replace_settings, content, flags=re.DOTALL)
              
              with open(proj_path, "w") as f:
                  f.write(content)
              print("Xcode project code signing disabled successfully.")
          '


      - name: Disable CocoaPods Code Signing
        run: |
          python3 -c '
          import os
          if os.path.exists("ios/Podfile"):
              with open("ios/Podfile", "r") as f:
                  content = f.read()
              target = "post_install do |installer|"
              insertion = "\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n      config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n    end\n  end\n"
              if target in content and insertion not in content:
                  content = content.replace(target, target + insertion)
                  with open("ios/Podfile", "w") as f:
                      f.write(content)
                  print("Podfile updated successfully to disable code signing.")
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Dev Client (Debug)
        run: |
          cd ios
          xcodebuild -workspace BootHub.xcworkspace \
            -scheme BootHub \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tee xcodebuild.log

      - name: Parse and Report Xcode Errors
        if: failure()
        run: |
          python3 scripts/parse-build-errors.py

      - name: Upload Xcode Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-dev-log
          path: ios/xcodebuild.log
          retention-days: 7


      - name: Package into IPA
        run: |
          cd ios/build/Build/Products/Debug-iphoneos
          mkdir Payload
          mv BootHub.app Payload/
          zip -qr ../../../../../BootHub-dev.ipa Payload

      - name: Upload dev client IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootHub-dev-client
          path: BootHub-dev.ipa
          retention-days: 30

      - name: Also attach to a pre-release (optional, easy to download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-client-latest
          name: Dev Client (Latest)
          body: |
            ## BootHub Dev Client

            Sideload this IPA to use as a development environment.
            It has all native modules compiled in (Reanimated, etc).

            ### How to use
            1. Sideload `BootHub-dev.ipa` via SideStore/Sideloadly/AltStore
            2. On your computer, run: `npx expo start --dev-client`
            3. Open the dev client app on your iPhone
            4. Enter your computer's IP or scan the QR code
            5. The app loads from your Metro server — full hot reload!

            **Only rebuild this when you add/remove a native module.**
          files: BootHub-dev.ipa
          prerelease: true
          make_latest: false
